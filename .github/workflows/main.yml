name: production deploy

on:
  push:
    branches:
      - main

jobs:
  test:
     runs-on: ubuntu-latest
     steps:
      - id: ssh
        uses: invi5H/ssh-action@v1
        with:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.DEV_SSHE_SSH_KEY }}
      
      - name: Run Cypress on Staging
        run: |
          ssh ${{ steps.ssh.outputs.SERVER }} \
          'cd /ci && npx cypress run --browser chrome --spec "cypress/e2e/yu_okamura.*"'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - id: ssh
      uses: invi5H/ssh-action@v1
      with:
        SSH_HOST: ${{ secrets.PROD_SSH_HOST}}
        SSH_PORT: ${{ secrets.PROD_SSH_PORT}}
        SSH_USER: ${{ secrets.PROD_SSH_USER}}
        SSH_KEY: ${{ secrets.PROD_SSH_KEY}}

    - name: Deploy to Production
      run: ssh ${{ steps.ssh.outputs.SERVER }} bash /app/yu_okamura/deploy.sh yu_okamura
